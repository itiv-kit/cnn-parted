general:
  fixed_sys: false
  acc_once: false
  max_num_platforms: 1
  num_pp: -1
  num_topos: 1
  num_jobs: 1
  optimization: all
  work_dir: runs/alexnet_resnet_mt_dbg
  keep_dir: true

workload:
- name: alexnet
  input-size: [1, 3, 227, 227]
- name: resnet18
  input-size: [1, 3, 227, 227]
- name: yolov5
  input-size: [1, 3, 224, 224]
- name: vgg13
  input-size: [1, 3, 227, 227]
- name: vgg11
  input-size: [1, 3, 227, 227]

pipeline:
  stages:
  - WorkloadParser
  - SystemParser
  - GraphAnalysis
  - NodeEvaluation
  - MultiTenancyOptimization
  - ExportMultiTenancyResults
  - VisualizeSchedule

mt:
  algorithm: optuna
  scheduling: earliest_finish
  optimizer:
    n_trials: 50
    sampler: nsga2

system:
  compute:
  - id: 0
    bits: 16
    fault_rates: [0, 0] # input, weight
    max_memory_size: 600000000
    instances: 1
    evaluation:
      accelerator: eyeriss_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
        search_size: 80
      simulator: timeloop
  - id: 2
    bits: 8
    max_memory_size: 600000000
    instances: 1
    evaluation:
      accelerator: simba_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
        search_size: 80

      simulator: timeloop
  link:
  - id: 1
    max_out_size: 20000000
    data_bit_width: 8
    noi:
      noi_mode: UCIe
      width: 16
      data_rate_Gbps: 4
      latency_ns: 2 # including D2D Adapter and PHY
      power_bit_pj: 0.5
    fps: 25
