compound_components:
  version: 0.3
  classes:
  - name: smartbuffer_SRAM
    attributes:
      technology: "45nm"
      memory_depth: 12
      memory_width: 16
      n_rdwr_ports: 2
      n_banks: 1
      n_buffets: 1
    subcomponents:
      - name: storage
        class: SRAM
        attributes:
          technology: technology
          width: memory_width
          depth: memory_depth
          n_rdwr_ports: n_rdwr_ports
          n_banks: n_banks
      - name: address_generators[0..1]
        class: intadder
        attributes:
          technology: technology
          width: ceil(log2(memory_depth))
    actions:
      - name: write
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: write
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: count
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: read
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: read
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: idle
        subcomponents:
          - name: storage
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0..1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
  - name: smartbuffer_RF
    attributes:
      technology: "45nm"
      memory_depth: 12
      memory_width: 16
      n_rdwr_ports: 2
      n_banks: 1
      n_buffets: 1
    subcomponents:
      - name: storage
        class: regfile
        attributes:
          technology: technology
          width: memory_width
          depth: memory_depth
          n_rdwr_ports: n_rdwr_ports
          n_banks: n_banks
      - name: address_generators[0..1]
        class: intadder
        attributes:
          technology: technology
          width: ceil(log2(memory_depth))
    actions:
      - name: write
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: write
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: read
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: read
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: idle
        subcomponents:
          - name: storage
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0..1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
  - name: lmac
    attributes:
      technology: "45nm"
      width: 8
    subcomponents:
      - name: cunit
        class: intmac 
        attributes:
          technology: technology
          width: width
    actions:
      - name: idle
        subcomponents:
          - name: cunit
            actions:
              - name: leak
                arguments:
                  action_latency_cycles: 1
      - name: compute
        subcomponents:
          - name: cunit
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
  - name: DRAM_wrapper
    attributes:
      type: "LPDDR4"
      width: 16
      block-size: 8
      word-bits: 8
    subcomponents:
      - name: dram
        class: DRAM 
        attributes:
          type: type
          width: width
    actions:
      - name: read
        subcomponents:
          - name: dram
            actions:
              - name: read
      - name: write
        subcomponents:
          - name: dram 
            actions:
              - name: write
      - name: idle
        subcomponents:
          - name: dram
            actions:
              - name: idle
  - name: regfile_storage
    attributes:
      technology: 45nm
      latency: 1ns
      width: 16
      depth: 1
    subcomponents:
      - name: storage
        class: regfile
        attributes:
          technology: technology
          latency: latency
          width : width
          depth: depth
    actions:
      - name: write
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
      - name: read
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
      - name: access
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1

architecture:
  subtree:
  - local:
    - attributes:
        block-size: 4
        type: "LPDDR4"
        width: 64
        word-bits: 16
      class: "DRAM_wrapper"
      name: "DRAM"
    name: "system"
    subtree:
    - attributes:
        technology: "45nm"
      local:
      - attributes:
          block-size: 4
          memory_depth: 108000
          memory_width: 64
          n_banks: 32
          read_bandwidth: 16
          word-bits: 16
          write_bandwidth: 16
        class: "smartbuffer_SRAM"
        name: "shared_glb"
      - attributes:
          block-size: 1
          depth: 16
          meshX: 16
          width: 5
          word-bits: 5
        class: "regfile_storage"
        name: "DummyBuffer[0..15]"
      name: "eyeriss"
      subtree:
      - local:
        - attributes:
            block-size: 1
            memory_depth: 32
            memory_width: 5
            meshX: 16
            read_bandwidth: 2
            word-bits: 5
            write_bandwidth: 2
          class: "smartbuffer_RF"
          name: "ifmap_spad"
        - attributes:
            block-size: 1
            memory_depth: 512
            memory_width: 5
            meshX: 16
            read_bandwidth: 2
            word-bits: 5
            write_bandwidth: 2
          class: "smartbuffer_RF"
          name: "weights_spad"
        - attributes:
            block-size: 1
            memory_depth: 80
            memory_width: 5
            meshX: 16
            read_bandwidth: 2
            update_fifo_depth: 2
            word-bits: 5
            write_bandwidth: 2
          class: "smartbuffer_RF"
          name: "psum_spad"
        - attributes:
            width: 5
            meshX: 16
          class: "lmac"
          name: "mac"
        name: "PE[0..159]"
  version: 0.3