image: gitlab.itiv.kit.edu:1443/itiv/docker/rocky9-timeloop:latest

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  UV_EXTRA_INDEX_URL: "https://pypi.nvidia.com"

default:
  cache: &global_cache
    key: $CI_PIPELINE_ID
    untracked: true
    paths:
      - cnnparted/tools/
      - .venv/
      - .cache/uv
      - .external_libs/
      - .chrome/

setup-env:
  stage: build
  cache:
    <<: *global_cache
    policy: push
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_SUBMODULE_FORCE_HTTPS: "true"
  before_script:
    - git config --global --add safe.directory '*'
    #- git config --global url."https://github.com/".insteadOf "git@github.com:"
    #- git submodule sync --recursive
    - git submodule foreach --recursive git reset --hard
    - export BROWSER_PATH="$CI_PROJECT_DIR/.chrome/chrome-linux64/chrome"
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sudo  env UV_INSTALL_DIR="/usr/local/bin" sh
    - git config --global --add safe.directory /builds/ai-hardware-accelerators/cnn-parted
    - ./install.sh


run-test:
  stage: test
  cache:
    <<: *global_cache
    policy: pull
  before_script:
    - export BROWSER_PATH="$CI_PROJECT_DIR/.chrome/chrome-linux64/chrome"
    - source env/setupEnv.sh
    - export PATH="$CI_PROJECT_DIR/.venv/bin:$PATH"
    - sudo ln -s /usr/lib/libstdc++.so.6 /usr/lib/libstdc++.so
    #- which accelergy
    #- accelergyTables -r $CI_PROJECT_DIR/cnnparted/tools/accelergy-timeloop-infrastructure
    - export ACCELERGYPATH=$(which accelergy)
    #- accelergy -l 
  script:
    - python3 cnnparted/cnnparted.py examples/test_pipeline/alexnet_pipe.yaml test
    - python3 cnnparted/cnnparted.py examples/test_pipeline/alexnet_partitioning.yaml test
  timeout: 12 hours
  artifacts:
    when: always
    paths:
      - test_pipe_alexnet
      - test_pipe_alexnet_part
 