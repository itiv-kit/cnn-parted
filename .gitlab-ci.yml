image: gitlab.itiv.kit.edu:1443/itiv/docker/rocky9-timeloop:latest

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy

default:
  cache: &global_cache
    key: $CI_PIPELINE_ID
    untracked: true
    paths:
      - cnnparted/tools/
      - .venv/
      - .cache/uv

setup-env:
  stage: build
  cache:
    <<: *global_cache
    policy: push
  variables:
    GIT_SUBMODULE_STRATEGY: none
    GIT_SUBMODULE_FORCE_HTTPS: "true"
  before_script:
    - git config --global --add safe.directory '*'
    - git config --global url."https://github.com/".insteadOf "git@github.com:"
    - git submodule sync --recursive
    - git submodule foreach --recursive git reset --hard
    - git submodule update --init --recursive
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sudo  env UV_INSTALL_DIR="/usr/local/bin" sh
    - git config --global --add safe.directory /builds/ai-hardware-accelerators/cnn-parted
    - uv sync
    - source env/setupEnv.sh 
    - uv pip install --no-cache-dir --index-url https://pypi.nvidia.com pytorch-quantization
    - git -C cnnparted/tools/accelergy-table-based-plug-ins/ apply --reject ../accelergy_table_plugins.patch || true
    - git submodule foreach --recursive 'if [ -f setup.py ] && [[ $name =~ "accelergy" ]]; then uv pip install .; elif [ -f setup.py ]; then uv pip install -e .; fi'
    - git submodule foreach --recursive 'if [ -f requirements.txt ]; then uv pip install -r requirements.txt; fi'
    - sudo ln -s /usr/lib/libstdc++.so.6 /usr/lib/libstdc++.so
    - source cnnparted/tools/install_tools.sh
    - source cnnparted/tools/setupTimeloop.sh


run-test:
  stage: test
  cache:
    <<: *global_cache
    policy: pull
  before_script:    
    - sudo ln -s /usr/lib/libstdc++.so.6 /usr/lib/libstdc++.so
    - source env/setupEnv.sh
    - export ACCELERGYPATH=$(which accelergy)
    - plotly_get_chrome
  script:
    - python3.11 cnnparted/cnnparted.py examples/test_pipeline/alexnet_pipe.yaml test
  timeout: 12 hours
  artifacts:
    when: always
    paths:
      - test_pipe_alexnet
 