general:
  work_dir: runs/googlenet_dbg

workload:
- name: googlenet
  input-size: [1, 3, 224, 224]

pipeline:
  stages:
  - WorkloadParser
  - SystemParser
  - GraphAnalysis
  - NodeEvaluation
  - PartitioningOptimization
  - ExportPartitionResults

partitioning:
  fixed_sys: false
  acc_once: false
  max_num_platforms:
  num_pp: -1
  num_jobs: 1
  num_topos: 1
  optimization: all

system:
  compute:
  - id: 0
    bits: 16
    fault_rates: [0, 0] # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: eyeriss_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
      simulator: timeloop
  - id: 2
    bits: 8
    fault_rates: [0, 0] # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: simba_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
      simulator: timeloop
  link:
  - id: 1
    max_out_size: 150000000
    data_bit_width: 16
    ethernet:
      cable_len_m: 5
      eee_lmi_ratio: 0.1
      eee_toff_ms: 0
      enable_eee: false
      eth_mode: BASE1000-T
    fps: 25
