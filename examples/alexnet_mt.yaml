general:
  work_dir: runs/timeloop_test
  keep_dir: true

workload:
  #- name: convnext
  #  input-size: [1, 3, 227, 227]
- name: alexnet
  frames: 10
  input-size: [2, 3, 227, 227]
  tiling:
    Conv:
      M: 8
      N: 2
    Gemm:
      M: 5
    MatMul:
      M: 2
- name: vgg11
  deadline: 130.0
  input-size: [1, 3, 227, 227]
  tiling:
    MatMul:
      M: 5
    'Gemm:':
      M: 5
    Conv:
      M: 8
- name: resnet18
  deadline: 150.0
  input-size: [1, 3, 227, 227]
- name: yolov5
  deadline: 300.0
  input-size: [1, 3, 224, 224]
- name: vgg13
  input-size: [1, 3, 227, 227]
  tiling:
    MatMul:
      M: 5
    'Gemm:':
      M: 5
    Conv:
      M: 8

pipeline:
  stages:
  - WorkloadParser
  - SystemParser
  - GraphAnalysis
  - NodeEvaluation
  - MultiTenancyOptimization
  - ExportMultiTenancyResults
  - VisualizeSchedule

multi-tenancy:
  strategy: deap
  scheduling: list
  scheduling_priority: earliest_start
  binding_granularity: tile
  num_jobs: 16
  cost_terms: ["energy", "latency"]
  optimizer:
    num_gen: 200
    #sampler: nsga2
    mutation_prob: 0.6
    crossover_prob: 0.3

system:
  compute:
  - id: 0
    bits: 16
    fault_rates: [0, 0] # input, weight
    max_memory_size: 600000000
    instances: 4
    evaluation:
      accelerator: eyeriss_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
        search_size: 80
      simulator: timeloop
  - id: 2
    bits: 8
    max_memory_size: 600000000
    instances: 4
    evaluation:
      accelerator: simba_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
        search_size: 80
      simulator: timeloop
  link:
  - id: 1
    max_out_size: 20000000
    data_bit_width: 8
    noi:
      noi_mode: UCIe
      width: 16
      data_rate_Gbps: 4
      latency_ns: 2 # including D2D Adapter and PHY
      power_bit_pj: 0.5
    fps: 25
  noc:
    topology: mesh
    shape: [2, 4]
    dram:
      location: below #or: above, right, left
      #neighbors: [[0,0]] #explicit list of nodes directly connected to the DRAM
