general:
  work_dir: test_pipe_alexnet
  keep_dir: false

workload:
- name: alexnet
  input-size: [1, 3, 227, 227]

dse:
  top_k: 1
  problem: DesignProblem
  optimizer:
    algorithm: exhaustive
    num_gen: 4
    population_size: 25
  optimization: edap

pipeline:
  stages:
  - WorkloadParser
  - SystemParser
  - GraphAnalysis
  - NodeEvaluation
  - PartitioningOptimization
  - ExportPartitionResults
  - VisualizeSchedule

partitioning:
  fixed_sys: false
  acc_once: false
  max_num_platforms:
  num_pp: -1
  num_jobs: 1
  num_topos: 1
  optimization: ppa

system:
  compute:
  - id: 0
    bits: 8
    fault_rates: [0, 0]   # input, weight
    max_memory_size: 600000000
    dse:
      min_pe: [16]
      max_pe: [64]
      min_size_mem_shared: [128, 64]
      max_size_mem_shared: [256, 128]
      mutator: GemminiArchitectureAdaptor
    evaluation:
      accelerator: gemmini_like
      simulator: timeloop
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 200
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
  - id: 2
    bits: 8
    max_memory_size: 600000000
    evaluation:
      accelerator: simba_like
      simulator: timeloop
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
  - id: 3
    fault_rates: [0, 1e-4]   # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: MRAM_area   # accelerator name
      conf_path: /configs/mnsim_configs/MRAM_area.ini
      simulator: mnsim
  - id: 4
    fault_rates: [0, 1e-4]   # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: MRAM_lat   # accelerator name
      conf_path: /configs/mnsim_configs/MRAM_lat.ini
      simulator: mnsim
  - id: 5
    fault_rates: [0, 1e-4]   # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: RRAM_acc   # accelerator name
      conf_path: /configs/mnsim_configs/RRAM_acc.ini

      simulator: mnsim
  link:
  - id: 1
    max_out_size: 20000000
    data_bit_width: 8
    noi:
      noi_mode: UCIe
      width: 16
      data_rate_Gbps: 4
      latency_ns: 2   # including D2D Adapter and PHY
      power_bit_pj: 0.5
    fps: 25
