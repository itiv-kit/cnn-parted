[project]
name = "cnn-parted"
version = "0.1.0"
description = "CNN inference hardware accelerator"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Fabian Kreß", email = "fabian.kress@kit.edu" }
]
keywords = ["cnn", "inference", "hardware", "accelerator"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    'License :: OSI Approved :: MIT License',
]

dependencies = [
    "absl-py>=2.3.0",
    "cerberus>=1.3.8",
    "deap>=1.4.4",
    "debugpy>=1.8.20",
    "joblib>=1.5.1",
    "kaleido>=1.0.0",
    "libconf>=2.0.1",
    "loguru>=0.7.3",
    "multiprocessing-on-dill>=3.5.0a4",
    "networkx>=3.5.0",
    "numpy>=2.0.2",
    "onnx>=1.18.0",
    "onnx2pytorch>=0.5.1",
    "onnx2torch>=1.5.15",
    "optuna>=4.7.0",
    "optunahub>=0.3.1",
    "pandas>=2.3.0",
    "plotly>=6.2.0",
    "prettytable>=3.16.0",
    "pydot>=4.0.1",
    "pymoo>=0.6.1.5",
    "pytorch-quantization==2.1.3",
    "pyyaml>=6.0.2",
    "ray>=2.54.0",
    "ruamel-yaml>=0.18.14",
    "scipy>=1.13.1",
    "scons>=4.9.1",
    "seaborn>=0.13.2",
    "setuptools==75.8.2",
    "sortedcontainers>=2.4.0",
    "sphinx-glpi-theme>=0.6",
    "stable-baselines3[extra]>=2.6.0",
    "typeguard>=4.4.4",
    "types-networkx>=3.5.0.20251106",
    "ultralytics>=8.3.178",
    "webdataset>=1.0.2",
    "wheel>=0.45.1",
]

[tool.setuptools]
include-package-data = true
packages = ["cnnparted"]

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv.sources]
pytorch-quantization = { index = "nvidia" }

#[tool.uv]
##no-build-isolation = true

[tool.uv.extra-build-dependencies]
multiprocessing-on-dill = ["setuptools"]
visdom = ["pkg_resources", "setuptools"]

[dependency-groups]
dev = [
    "ty>=0.0.43",
]

[tool.ty.src]
exclude = ["cnnparted/tools", "cnnparted/framework/node/helpers.py"]

[tool.ty.analysis]
allowed-unresolved-imports = ["framework.**"]