general:
  work_dir: test_pipe_alexnet_part
  keep_dir: false

workload:
- name: alexnet
  input-size: [1, 3, 227, 227]

pipeline:
  stages:
  - WorkloadParser
  - SystemParser
  - GraphAnalysis
  - NodeEvaluation
  - PartitioningOptimization
  - ExportPartitionResults


partitioning:
  fixed_sys: false
  acc_once: false
  max_num_platforms:
  num_pp: -1
  num_jobs: 1
  num_topos: 1
  optimization: all

system:
  compute:
  - id: 0
    bits: 16
    fault_rates: [0, 0] # input, weight
    max_memory_size: 600000000
    evaluation:
      accelerator: eyeriss_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
      simulator: timeloop
  - id: 2
    bits: 8
    max_memory_size: 600000000
    evaluation:
      accelerator: simba_like
      frequency: 200000000
      layer: conv2d
      mapper:
        algorithm: random-pruned
        live-status: false
        max-permutations-per-if-visit: 16
        num-threads: 8
        optimization-metrics:
        - edp
        timeout: 15000
        victory-condition: 500
      simulator: timeloop
  link:
  - id: 1
    max_out_size: 20000000
    data_bit_width: 8
    noi:
      noi_mode: UCIe
      width: 16
      data_rate_Gbps: 4
      latency_ns: 2 # including D2D Adapter and PHY
      power_bit_pj: 0.5
    fps: 25
