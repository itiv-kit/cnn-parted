compound_components:
  version: 0.3
  classes:
  - name: smartbuffer_SRAM
    attributes:
      technology: "45nm"
      memory_depth: 12
      memory_width: 16
      n_rdwr_ports: 2
      n_banks: 1
      n_buffets: 1
    subcomponents:
      - name: storage
        class: SRAM
        attributes:
          technology: technology
          width: memory_width
          depth: memory_depth
          n_rdwr_ports: n_rdwr_ports
          n_banks: n_banks
      - name: address_generators[0..1]
        class: intadder
        attributes:
          technology: technology
          width: ceil(log2(memory_depth))
    actions:
      - name: write
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: write
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: count
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: read
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: read
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: idle
        subcomponents:
          - name: storage
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0..1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
  - name: smartbuffer_RF
    attributes:
      technology: "45nm"
      memory_depth: 12
      memory_width: 16
      n_rdwr_ports: 2
      n_banks: 1
      n_buffets: 1
    subcomponents:
      - name: storage
        class: regfile
        attributes:
          technology: technology
          width: memory_width
          depth: memory_depth
          n_rdwr_ports: n_rdwr_ports
          n_banks: n_banks
      - name: address_generators[0..1]
        class: intadder
        attributes:
          technology: technology
          width: ceil(log2(memory_depth))
    actions:
      - name: write
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: write
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: read
        arguments:
          data_delta: 0..1
          address_delta: 0..n_banks
        subcomponents:
          - name: storage
            actions:
              - name: read
                arguments:
                  data_delta: data_delta
                  address_delta: address_delta
                  action_latency_cycles: 1
          - name: address_generators[1]
            actions:
              - name: add
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
      - name: idle
        subcomponents:
          - name: storage
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
          - name: address_generators[0..1]
            actions:
              - name: idle
                arguments:
                  action_latency_cycles: 1
  - name: lmac
    attributes:
      technology: "45nm"
      width: 8
    subcomponents:
      - name: cunit
        class: intmac 
        attributes:
          technology: technology
          width: width
    actions:
      - name: idle
        subcomponents:
          - name: cunit
            actions:
              - name: leak
                arguments:
                  action_latency_cycles: 1
      - name: compute
        subcomponents:
          - name: cunit
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
  - name: DRAM_wrapper
    attributes:
      type: "LPDDR4"
      width: 16
      block-size: 8
      word-bits: 8
    subcomponents:
      - name: dram
        class: DRAM 
        attributes:
          type: type
          width: width
    actions:
      - name: read
        subcomponents:
          - name: dram
            actions:
              - name: read
      - name: write
        subcomponents:
          - name: dram 
            actions:
              - name: write
      - name: idle
        subcomponents:
          - name: dram
            actions:
              - name: idle
  - name: regfile_storage
    attributes:
      technology: 45nm
      latency: 1ns
      width: 16
      depth: 1
    subcomponents:
      - name: storage
        class: regfile
        attributes:
          technology: technology
          latency: latency
          width : width
          depth: depth
    actions:
      - name: write
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
      - name: read
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1
      - name: access
        subcomponents:
          - name: storage
            actions:
              - name: access
                arguments:
                  action_latency_cycles: 1


architecture:
  # ============================================================
  # Architecture Description
  # ============================================================
  version: 0.3
  subtree:
    - name: system
      local:
        - name: DRAM
          class: DRAM_wrapper
          attributes:
            type: LPDDR4
            width: 16
            block-size: 4
            word-bits: 4
      subtree:
        - name: eyeriss
          attributes:
            technology: 45nm
          local:
            - name: shared_glb
              class: smartbuffer_SRAM
              attributes:
                memory_depth: 16384
                memory_width: 16
                n_banks: 32
                block-size: 4
                word-bits: 4
                read_bandwidth: 16
                write_bandwidth: 16
            - name: DummyBuffer[0..13] # for better mapping
              class: regfile_storage
              attributes:
                depth: 16
                width: 4
                word-bits: 4
                block-size: 1
                meshX: 14
          subtree:
          - name: PE[0..167]
            local:
              - name: ifmap_spad
                class: smartbuffer_RF
                attributes:
                  memory_depth: 12
                  memory_width: 4
                  block-size: 1
                  word-bits: 4
                  meshX: 14
                  read_bandwidth: 2
                  write_bandwidth: 2
              - name: weights_spad
                class: smartbuffer_RF
                attributes:
                  memory_depth: 192
                  memory_width: 4
                  block-size: 1
                  word-bits: 4
                  meshX: 14
                  read_bandwidth: 2
                  write_bandwidth: 2
              - name: psum_spad
                class: smartbuffer_RF
                attributes:
                  memory_depth: 16
                  memory_width: 4
                  update_fifo_depth: 2
                  block-size: 1
                  word-bits: 4
                  meshX: 14
                  read_bandwidth: 2
                  write_bandwidth: 2
              - name: mac
                class: lmac
                attributes:
                  width: 4
                  meshX : 14